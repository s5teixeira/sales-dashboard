spring.application.name=sales-dashboard

# Persistent, file-based H2 database (stored in ./data, excluded from Git)
spring.datasource.url=jdbc:h2:file:./data/salesdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Create tables on startup (schema.sql uses CREATE TABLE IF NOT EXISTS, so data survives restarts)
spring.sql.init.mode=always

# Browse the database at http://localhost:8080/h2-console (JDBC URL above, user "sa", no password)
spring.h2.console.enabled=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Location of the bundled sample dataset (copied from sample_data/ at build time)
app.sample-data.location=classpath:sample_data/sales_sample.csv

# Add a content fingerprint to CSS/JS URLs (e.g. /css/app-3f2a9c.css). Thymeleaf writes these URLs
# automatically, so whenever a file changes its URL changes too and the browser can never use an old copy.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
